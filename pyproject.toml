[tool.poetry]
name = "generic-mip"
version = "0.0.0"
description = "Generic MIP framework"
authors = ["Matthias Als <mata@ecco.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
ortools = { version = "9.6.2534", optional = true }
highspy = { version = "<1.7.0", optional = true }
gurobipy = [
    { version = "9.5.2", python = ">=3.9,<3.11", optional = true },
    { version = "10.0.1", python = ">=3.11,<3.12", optional = true }
]
localsolver = { version = "^11.5.20221123", source = "localsolver", optional = true }
docplex = { version = "^2.25", optional = true}
numpy = "^1.23.2"
scipy = "^1.9.0"
adapta = "^3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7"
pylint = "^3"
pytest-cov = "^2.12.1"
pandas = "~2.0"
black = "^23"

[tool.poetry.extras]
ortools = [
    'ortools'
]
gurobi = [
    'gurobipy'
]
localsolver = [
    'localsolver'
]
highs = [
    'highspy'
]
docplex = [
    'docplex'
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
extend-exclude = 'tests/data/.*'

[[tool.poetry.source]]
name = "custom_repo"
url = "https://esd-code-artifact-production-497010676583.d.codeartifact.eu-central-1.amazonaws.com/pypi/esd-artifacts/simple/"
priority = "default"

[[tool.poetry.source]]
name = "localsolver"
url = "https://pip.localsolver.com/"
priority = "supplemental"
