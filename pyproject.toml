[tool.poetry]
name = "generic-mip"
version = "0.0.0"
description = "Generic MIP framework"
authors = ["Matthias Als <mata@ecco.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
ortools = { version = "~9.15", optional = true }
highspy = { version = "~1.14.0", optional = true }
gurobipy = [
    { version = "9.5.2", python = ">=3.9,<3.11", optional = true },
    { version = "10.0.1", python = ">=3.11,<3.12", optional = true }
]
localsolver = { version = "^11.5.20221123", source = "localsolver", optional = true }
docplex = { version = "^2.25", optional = true}
pyscipopt = { version = "^5.4.1", optional = true}
numpy = "^2.0.2"
scipy = "^1.9.0"
numexpr = "2.11.0" # pinned due to issues with numpy.typing in 2.14
adapta = "^4.0"
dataclasses-json = "^0.6.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pylint = "^3"
pytest-cov = "^2.12.1"
pandas = "^2.2.0"
black = "^23"

[tool.poetry.extras]
ortools = [
    'ortools'
]
gurobi = [
    'gurobipy'
]
localsolver = [
    'localsolver'
]
highs = [
    'highspy'
]
docplex = [
    'docplex'
]
pyscipopt = [
    'pyscipopt'
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
extend-exclude = 'tests/data/.*'

[[tool.poetry.source]]
name = "custom_repo"
url = "https://esd-code-artifact-production-497010676583.d.codeartifact.eu-central-1.amazonaws.com/pypi/esd-artifacts/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "localsolver"
url = "https://pip.localsolver.com/"
priority = "supplemental"
