[tool.poetry]
name = "generic-mip"
version = "0.0.0"
description = "Generic MIP framework"
authors = ["Matthias Als <mata@ecco.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
ortools = { version = "9.3.10497", optional = true }
gurobipy = { version = "9.5.2", optional = true }
numpy = "^1.23.2"
scipy = "^1.9.0"
proteus = { version = "^1.3", source = "azops" }

[tool.poetry.group.dev.dependencies]
pytest = "~6.2.0"
pylint = "~2.14.0"
pytest-cov = "~2.12.1"
pandas = "~1.4.3"

[tool.poetry.extras]
ortools = [
    'ortools'
]
gurobi = [
    'gurobipy'
]

[[tool.poetry.source]]
name = "azops"
url = "https://pkgs.dev.azure.com/eccoSneaksAndData/_packaging/eccoSneaksAndData/pypi/simple/"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
