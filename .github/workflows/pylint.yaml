name: Validate code linting

on:
  pull_request:
    branches: [ main ]

jobs:
  validate_code:
    name: Validate code linting
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    if: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.x'
          architecture: 'x64'
